plugins { id 'com.android.application' }
android {
  namespace 'com.nbauniverse.manager.rebuild'
  compileSdk 35
  defaultConfig {
    applicationId 'com.nbauniverse.manager.rebuild'
    minSdk 24
    targetSdk 35
    versionCode 90101
    versionName '9.1.1-r1'
  }
  buildTypes { release { minifyEnabled false }; debug { debuggable true } }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies { implementation 'androidx.webkit:webkit:1.13.0' }
